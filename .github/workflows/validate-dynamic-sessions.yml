name: Validate Dynamic Sessions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run Dynamic Sessions tests
        run: python -m unittest discover -s tests/dynamic_sessions -v

  office-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install smoke-test utilities
        run: sudo apt-get update && sudo apt-get install --yes jq unzip
      - name: Build and test Dynamic Sessions Office image
        run: bash scripts/dynamic-sessions/smoke-office-local.sh
