name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate repository and lab syntax
        run: bash scripts/validate-repo.sh

  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run agent orchestration tests
        run: python -m unittest discover -s tests -v

  office-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install smoke-test utilities
        run: sudo apt-get update && sudo apt-get install --yes jq unzip
      - name: Build and test Office container
        run: bash scripts/smoke-office-local.sh
