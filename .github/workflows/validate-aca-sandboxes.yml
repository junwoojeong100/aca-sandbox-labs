name: Validate ACA Sandboxes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install ACA Sandboxes SDK
        run: >-
          python -m pip install
          azure-containerapps-sandbox==0.1.0b4
          azure-identity
      - name: Run ACA Sandboxes tests
        run: python -m unittest discover -s tests/aca_sandboxes -v
